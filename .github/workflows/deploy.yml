# Auto-deploys on every push to main — dormant until the repo has a
# CLOUDFLARE_API_TOKEN secret (Settings -> Secrets and variables -> Actions).
# Create the token at dash.cloudflare.com -> profile -> API Tokens with the
# "Edit Cloudflare Workers" template + Cloudflare Pages: Edit permission.
name: deploy
on:
  push:
    branches: [main]
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dedb2334bceca05c17667f401a53e26d
          command: pages deploy site --project-name=p2irl --commit-dirty=true
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dedb2334bceca05c17667f401a53e26d
          workingDirectory: worker
          command: deploy
